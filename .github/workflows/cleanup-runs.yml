name: Cleanup
on:
  push:
jobs:
  del_runs:
    runs-on: ubuntu-26.04-arm
    
    steps:
      - name: Delete workflow runs
        uses: Mattraks/delete-workflow-runs@main
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 0
          keep_minimum_runs: 0
